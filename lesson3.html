<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第三堂｜剪映 CapCut－小導演任務</title>
<style id="gate-boot">html:not(.gate-ready) body>*:not(#gate-overlay){visibility:hidden!important}</style>
<script src="./auth.js"></script>
<script src="./toolbox.js"></script>
<script>CourseGate.guardLesson()</script>
<style>
:root{--bg:#101724;--ink:#f4f7fb;--muted:#9eafc4;--mint:#72efb4;--line:#31445f;--cyan:#3ecbff;--bad:#ffb089}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:1px solid var(--mint);background:var(--mint);color:#102018;border-radius:8px;padding:10px 14px;font-weight:800}
.quiet{background:transparent;color:var(--ink);border-color:var(--line);font-weight:600}
header{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 3vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:#101724;z-index:5}
header a,header button{color:var(--mint);text-decoration:none}
header nav{display:flex;gap:8px;flex-wrap:wrap}
main{max-width:1180px;margin:auto;padding:16px 16px 28px}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr);gap:14px;align-items:start}
.editor{background:#121820;border:1px solid #2a3544;border-radius:14px;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0d1218;color:#d5deea;font-size:14px}
.topbar b{color:var(--cyan)}
.workspace{display:grid;grid-template-columns:168px 1fr;min-height:250px}
.bin,.preview{border-right:1px solid #2a3544;border-bottom:1px solid #2a3544}
.bin{padding:8px;background:#161d27}
.bin h3,.time h3{margin:0 0 8px;font-size:13px;color:#8ea0b8}
.thumb{display:flex;gap:8px;width:100%;text-align:left;background:#0e141c;color:var(--ink);border:1px solid #31445f;border-radius:8px;padding:4px;margin:0 0 6px;font-weight:600}
.thumb img{width:54px;height:36px;object-fit:cover;border-radius:4px;background:#243140}
.thumb small{display:block;color:var(--muted);font-weight:500}
.preview{position:relative;min-height:250px;background:#070b10;display:flex;align-items:center;justify-content:center}
.preview img{width:100%;height:250px;object-fit:cover;display:block}
.preview .empty{color:#8ea0b8;padding:24px;text-align:center}
.caption{position:absolute;left:8%;right:8%;text-align:center;font-weight:900;font-size:28px;color:#fff;text-shadow:0 2px 8px #000}
.caption.low{bottom:16px}
.caption.mid{top:42%}
.caption.block{top:38%;background:#000c}
.playhead-tag{position:absolute;top:8px;left:8px;background:#000c;color:var(--cyan);border-radius:6px;padding:4px 8px;font-size:12px}
.timeline{padding:10px}
.tracks{display:flex;flex-direction:column;gap:6px}
.track{display:flex;gap:6px;min-height:54px;align-items:stretch;background:#0e141c;border:1px dashed #31445f;border-radius:8px;padding:6px}
.track b{width:42px;flex:none;font-size:12px;color:#8ea0b8;align-self:center}
.seg{flex:1;min-width:70px;border:0;border-radius:6px;padding:4px;color:#fff;font-weight:800;background:#24506a center/cover}
.seg.wait{background:#3a2a24}
.seg.on{outline:2px solid var(--cyan)}
.audio{height:14px;border-radius:6px;background:repeating-linear-gradient(90deg,#3ecbff 0 6px,#163246 6px 10px);align-self:center}
.sources{display:flex;gap:8px;overflow:auto;padding:8px;background:#0d1218}
.sources .thumb{width:140px;flex:none;margin:0}
.zone-hot{box-shadow:inset 0 0 0 2px var(--cyan)}
.coach{background:#1a2538;border:1px solid var(--line);border-radius:14px;padding:16px}
.stepno{color:var(--mint);font-weight:800;font-size:13px}
.coach h1{font-size:26px;line-height:1.3;margin:6px 0 8px}
.coach p{font-size:17px;line-height:1.55;margin:8px 0;color:#d5deea}
.say{font-size:20px;color:#fff}
.real{background:#121b2b;border-left:4px solid var(--cyan);padding:10px 12px;border-radius:0 8px 8px 0;color:#d5deea}
.real b{color:var(--cyan)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.feedback{min-height:1.4em;color:var(--mint);font-weight:700}
.feedback.bad{color:var(--bad)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frame{background:#0e141c;border-radius:10px;overflow:hidden;border:1px solid #31445f}
.frame img{width:100%;height:120px;object-fit:cover;display:block}
.frame span{display:block;padding:8px;font-size:14px}
.frame.good{border-color:var(--mint)}
.term{border:0;border-bottom:1px dashed var(--mint);background:transparent;color:inherit;padding:0;border-radius:0;font:inherit;cursor:help}
dialog{background:#1a2538;color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(480px,92vw);padding:18px}
dialog::backdrop{background:#000a}
.vol{width:100%}
@media(max-width:860px){.layout{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.bin{border-right:0}}
</style>
</head>
<body>
<header>
  <strong>小導演任務 <small style="color:#72efb4">第三堂 · 跟著畫面做一支片</small></strong>
  <nav>
    <a href="./index.html">← 課程目錄</a>
    <button class="quiet" onclick="DirectorToolbox.open()">🧰 工具箱</button>
  </nav>
</header>
<main>
  <div class="layout">
    <section class="editor" id="stage"></section>
    <aside class="coach" id="coach"></aside>
  </div>
</main>
<dialog id="word">
  <button class="quiet" onclick="word.close()">關閉</button>
  <h2 id="wordTitle"></h2>
  <p id="wordMean"></p>
  <p id="wordEx"></p>
</dialog>
<script>
const words = {
  '素材庫': ['還沒排好的影片、照片，先放在左邊。', '像桌上的材料，還沒下鍋。'],
  '預覽窗': ['中間這個大畫面，就是觀眾會看到的。', '先看這裡，才知道字幕有沒有擋住人。'],
  '時間軸': ['下面那一條，用來排隊、切開、刪掉。', '故事的順序，就是這一條的順序。'],
  '播放頭': ['會移動的線，代表現在看到第幾秒。', '要切開時，先把線停在那個點。'],
  '分割': ['在播放頭的位置，把一段切成兩段。', '先切，才能把不要的那一半刪掉。'],
  '匯出': ['把剪好的結果存成一支影片檔。', '短影音常用直式，像手機螢幕。']
};
const clips = {
  find: {title:'發現對手', img:'./assets/rivals-discover.webp', sec:2},
  fight: {title:'反擊', img:'./assets/rivals-focus.webp', sec:4},
  win: {title:'勝利', img:'./assets/rivals-view.webp', sec:2},
  trip: {title:'去旅行', img:'./assets/travel.webp', sec:6},
  walk: {title:'走路找人', img:'./assets/rivals-view.webp', sec:12, wait:true}
};
const steps = [
  {t:'先看你要做出來的樣子', say:'左邊是整段錄影，很多時間在走路。右邊才是今天要的 15 秒：發現、反擊、勝利。', real:'剪映不會幫你決定留什麼。你先想好，再按按鈕。'},
  {t:'認三個地方', say:'先點左邊、中間、下面。點到的地方會亮起來，並告訴你它在做什麼。', real:'真的剪映也是這三塊：左邊素材、中間預覽、下面時間軸。'},
  {t:'把有用的畫面放進素材庫', say:'點下面四張。這支片要講「失誤後逆轉」，旅行那張不要放進來。', real:'按「導入」。進來的東西先待在左邊，還沒算進影片。'},
  {t:'拖上時間軸', say:'點左邊三張，放到下面。中間會立刻換成你點的那張。', real:'用滑鼠從左邊拖到下面那一條。'},
  {t:'切開，刪掉走路', say:'整段不小心都放上來了。先把播放頭停在走路後面，再分割，最後刪掉走路。', real:'播放頭對準要切的地方 → 剪刀（分割）→ 點不要的那段 → 刪除。'},
  {t:'排成看得懂的順序', say:'播放看看。若觀眾還不知道發生什麼，就把片段往左或往右移。', real:'在時間軸上直接拖片段。順序就是觀眾理解的順序。'},
  {t:'加一句字幕', say:'字要讓人讀到，也不能擋住對手。選一個位置，看中間的畫面。', real:'按「文字」打「只能用手槍」。字多就放下面。'},
  {t:'音樂小聲一點', say:'拉桿子。人說話要聽得見，音樂只是氣氛。', real:'音樂在另一條軌道。點音樂，再拉小音量。'},
  {t:'看一遍，再匯出', say:'按播放。開頭、過程、結果都在，字幕沒擋人，就可以存檔。', real:'右上角「匯出」。短影音選直式 9:16。不一定要上傳。'}
];
let note = null;
let step = 0;
let bin = [];
let timeline = [];
let zones = {bin:false, preview:false, time:false};
let playhead = false, split = false;
let caption = '';
let volume = 80;
let timer = null;

function term(name){ return '<button class="term" data-word="'+name+'">'+name+'</button>'; }

function stageHTML(){
  if(step===0){
    return '<div class="topbar"><b>今天的成品</b><span>同一段錄影，兩種看法</span></div><div class="compare" style="padding:12px"><div class="frame"><img src="./assets/rivals-view.webp" alt="走路很久的畫面"><span>原片：一直走路。觀眾不知道這支片要看什麼。</span></div><div class="frame good"><div style="display:grid;grid-template-columns:1fr 1fr 1fr"><img src="./assets/rivals-discover.webp" alt="發現"><img src="./assets/rivals-focus.webp" alt="反擊"><img src="./assets/rivals-view.webp" alt="勝利"></div><span>剪完：發現 → 反擊 → 勝利。15 秒就看懂。</span></div></div>';
  }
  const preview = currentFrame();
  const binHTML = bin.map(id=>thumb(id, step===3)).join('') || '<p class="empty">左邊還是空的</p>';
  const segs = timeline.map(id=>'<div class="seg'+(clips[id].wait?' wait':'')+'" style="'+(clips[id].wait?'':'background-image:linear-gradient(#0008,#0008),url('+clips[id].img+')')+'">'+clips[id].title+'<small style="display:block;font-weight:600">'+clips[id].sec+'秒</small>'+(step===5?'<span class="row"><button class="quiet" data-shift="'+id+'" data-dir="-1">往前</button></span>':'')+'</div>').join('');
  const sources = step===2 ? '<div class="sources">'+['find','fight','trip','win'].map(id=>thumb(id,true)).join('')+'</div>' : '';
  return '<div class="topbar"><b>剪映練習台</b><span>跟真的軟體同一套位置</span></div>'
    +'<div class="workspace"><div class="bin'+(step===1&&!zones.bin?' zone-hot':'')+'" data-zone="bin"><h3>素材庫</h3>'+binHTML+'</div>'
    +'<div class="preview'+(step===1&&!zones.preview?' zone-hot':'')+'" data-zone="preview">'
    +(preview?'<img src="'+preview.img+'" alt="'+preview.title+'"><div class="playhead-tag">'+(playhead&&step>=4?'播放頭停在走路後面':'預覽窗')+'</div>'+(caption?'<div class="caption '+(caption==='擋臉'?'block':caption==='中間'?'mid':'low')+'">只能用手槍</div>':'') : '<div class="empty">預覽窗<br>放上時間軸後，這裡會出現畫面</div>')
    +'</div></div><div class="timeline" data-zone="time"><h3>時間軸</h3><div class="tracks"><div class="track"><b>影片</b>'+(segs||'<span class="empty">還沒有片段</span>')+'</div>'
    +(step>=6?'<div class="track"><b>字幕</b><span class="seg">'+(caption?'只能用手槍':'還沒加')+'</span></div>':'')
    +(step>=7?'<div class="track"><b>音樂</b><i class="audio" style="flex:'+Math.max(1,volume/25)+';opacity:'+(volume/100)+'"></i></div>':'')
    +'</div></div>'+sources;
}
function thumb(id, clickable){
  const c = clips[id];
  return '<button class="thumb" data-clip="'+id+'" '+(clickable?'':'disabled')+'><img src="'+c.img+'" alt=""><span>'+c.title+'<small>'+c.sec+' 秒</small></span></button>';
}
function currentFrame(){
  if(!timeline.length) return null;
  const id = timeline.find(x=>!clips[x].wait) || timeline[0];
  return clips[id];
}
function coachHTML(){
  const s = steps[step];
  let extra = '';
  if(step===4) extra = '<div class="row"><button id="doHead" class="quiet">1. 播放頭停好</button><button id="doSplit" class="quiet">2. 分割</button><button id="doDel" class="quiet">3. 刪掉走路</button></div>';
  if(step===5) extra = '<div class="row"><button id="play" class="quiet">▶ 播放看看</button></div>';
  if(step===6) extra = '<div class="row"><button class="quiet" data-cap="中間">放中間</button><button class="quiet" data-cap="下面">放下面</button><button class="quiet" data-cap="擋臉">蓋住畫面</button></div>';
  if(step===7) extra = '<label>音樂音量 <output id="volOut">'+volume+'</output></label><input class="vol" id="vol" type="range" min="0" max="100" value="'+volume+'">';
  if(step===8) extra = '<div class="row"><button id="play">▶ 播放我的 15 秒</button></div>';
  return '<div class="stepno">第 '+(step+1)+' 步 / '+steps.length+'</div><h1>'+s.t+'</h1><p class="say">'+s.say+'</p><div class="real"><b>到真的剪映</b><p>'+s.real+'</p><p>看不懂的詞可以點：'+term('素材庫')+' '+term('預覽窗')+' '+term('時間軸')+' '+term('播放頭')+' '+term('分割')+' '+term('匯出')+'</p></div>'+extra+'<p class="feedback" id="fb"></p><div class="row"><button class="quiet" id="back">上一步</button><button id="forward">這步做好了 →</button></div>';
}
function render(){
  stopPlay();
  if(step===4 && !timeline.includes('walk')) timeline.unshift('walk');
  stage.innerHTML = stageHTML();
  coach.innerHTML = coachHTML();
  bind();
  if(note){ const fb=document.getElementById('fb'); fb.textContent=note.text; fb.className='feedback'+(note.bad?' bad':''); }
}
function ready(){
  if(step===1) return zones.bin && zones.preview && zones.time;
  if(step===2) return ['find','fight','win'].every(id=>bin.includes(id));
  if(step===3) return ['find','fight','win'].every(id=>timeline.includes(id));
  if(step===4) return !timeline.includes('walk') && split;
  if(step===5) return timeline.join()==='find,fight,win';
  if(step===6) return caption==='下面' || caption==='中間';
  if(step===7) return volume>=15 && volume<=45;
  return true;
}
function say(text, bad){ note={text, bad}; const fb=document.getElementById('fb'); if(!fb) return; fb.textContent=text; fb.className='feedback'+(bad?' bad':''); }
function bind(){
  document.getElementById('back').onclick=()=>{ if(step>0){step--; render()} };
  document.getElementById('forward').onclick=()=>{
    if(!ready()){ say(hint(), true); return }
    if(step<steps.length-1){ note=null; step++; render() } else say('這支 15 秒可以收了。打開剪映，用你自己的四格計畫再做一次。');
  };
  stage.querySelectorAll('[data-zone]').forEach(el=>el.onclick=()=>{
    if(step!==1) return;
    zones[el.dataset.zone]=true;
    const name = el.dataset.zone==='bin'?'素材庫':el.dataset.zone==='preview'?'預覽窗':'時間軸';
    say(name+'：'+words[name][0]);
    render();
  });
  stage.querySelectorAll('[data-clip]').forEach(el=>el.onclick=()=>useClip(el.dataset.clip));
  const head=document.getElementById('doHead'), sp=document.getElementById('doSplit'), del=document.getElementById('doDel');
  if(head) head.onclick=()=>{ playhead=true; say('播放頭已停在走路後面。下一步按分割。'); render() };
  if(sp) sp.onclick=()=>{ if(!playhead){say('先把播放頭停好，剪映才知道切哪裡。',true);return} split=true; say('已經切開。現在刪掉走路那段。'); };
  if(del) del.onclick=()=>{ if(!split){say('還沒切，不能只刪一半。先分割。',true);return} timeline=timeline.filter(id=>id!=='walk'); say('走路刪掉了。剩下的才是故事。'); render() };
  stage.querySelectorAll('[data-shift]').forEach(el=>el.onclick=ev=>{ ev.stopPropagation(); move(el.dataset.shift, +el.dataset.dir) });
  const play=document.getElementById('play');
  if(play) play.onclick=playFilm;
  document.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{
    caption=b.dataset.cap;
    say(caption==='擋臉'?'這會擋住要看的人，換個位置。':'這個位置讀得到，也看得到畫面。');
    render();
  });
  const vol=document.getElementById('vol');
  if(vol) vol.oninput=()=>{ volume=+vol.value; document.getElementById('volOut').textContent=volume; const bar=stage.querySelector('.audio'); if(bar){ bar.style.flex=Math.max(1,volume/25); bar.style.opacity=volume/100 } say(volume>45?'還是太大，說話會被蓋住。':volume<15?'音樂幾乎沒有了，拉高一點。':'這個大小，氣氛在，人聲也在。'); };
  document.querySelectorAll('.term').forEach(b=>b.onclick=()=>{
    const w=words[b.dataset.word]; wordTitle.textContent=b.dataset.word; wordMean.textContent=w[0]; wordEx.textContent=w[1]; word.showModal();
  });
}
function hint(){
  return ['先看完兩邊的差別再繼續。','三個區域都點過一次。','三張對戰畫面都放進左邊，旅行先不要。','三張都放到下面的時間軸。','依序：播放頭、分割、刪掉走路。','排成發現 → 反擊 → 勝利，再按下一步。','字幕放中間或下面，不要擋臉。','音量調到中間偏小。',''][step];
}
function useClip(id){
  if(step===2){
    if(id==='trip'){ say('這張是旅行，跟「逆轉」無關，先留在外面。', true); return }
    if(!bin.includes(id)) bin.push(id);
    say(clips[id].title+' 已放進素材庫。它還不是影片的一部分。');
    render();
  } else if(step===3){
    if(!timeline.includes(id)) timeline.push(id);
    say('預覽窗換成「'+clips[id].title+'」。觀眾現在會看到這張。');
    render();
  }
}
function move(id, dir){
  const i = timeline.indexOf(id);
  const j = i+dir;
  if(j<0 || j>=timeline.length) return;
  const tmp = timeline[i]; timeline[i]=timeline[j]; timeline[j]=tmp;
  say('現在順序：'+timeline.map(id=>clips[id].title).join(' → '));
  render();
}
function playFilm(){
  stopPlay();
  const frames = timeline.filter(id=>!clips[id].wait);
  if(!frames.length){ say('時間軸還沒有畫面。', true); return }
  let i=0;
  const show=()=>{
    const c=clips[frames[i%frames.length]];
    const img=stage.querySelector('.preview img');
    if(img) img.src=c.img;
    i++;
  };
  show();
  timer=setInterval(show, 900);
  say('跟著看：'+frames.map(id=>clips[id].title).join(' → ')+(caption?'。字幕：「只能用手槍」':''));
}
function stopPlay(){ if(timer){clearInterval(timer); timer=null} }
render();
window.addEventListener('load', ()=>{ if(window.DirectorToolbox) DirectorToolbox.mount({fab:false}) });
</script>
</body>
</html>
